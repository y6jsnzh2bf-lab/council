
name: AI Trading Council

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  market-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan Bitkub market
        run: python main.py
